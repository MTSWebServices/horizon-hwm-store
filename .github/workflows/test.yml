name: Tests
on:
  push:
    branches:
      - develop
  pull_request:
    branches-ignore:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_PYTHON: '3.14'
  MIN_COVERAGE: 90

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  tests:
    name: Run tests (Python ${{ matrix.python-version }}, etl-entities=${{ matrix.etl-entities-version }}, horizon-client=${{ matrix.horizon-client-version }}, horizon-image=${{ matrix.horizon-image-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        etl-entities-version: ['2', '3']
        horizon-client-version: ['1', '2']
        horizon-image-version: ['2.0.0']

        include:
          # minimal supported versions
          - python-version: '3.10'
            etl-entities-version: '2'
            horizon-client-version: '1'
            horizon-image-version: '1.1.3'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start Backend Container
        run: |
          docker compose down -v --remove-orphans
          docker compose up --wait-timeout 60 -d
        env:
          HORIZON_IMAGE: mtsrus/horizon-backend:${{ matrix.horizon-image-version }}
          COMPOSE_PROJECT_NAME: ${{ github.run_id }}-backend

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: 'false'

      # no uv cache here because fresh install takes about 1 second

      - name: Install dependencies
        run: |
          uv sync \
            --group test \
            --group "test-etl-entities-${{ matrix.etl-entities-version }}" \
            --group "test-data-horizon-${{ matrix.horizon-client-version }}"

      - name: Run tests
        run: |
          mkdir reports/ || echo "Directory exists"
          source .env.local
          uv run coverage run -m pytest --junitxml=reports/junit/python${{ matrix.python-version }}-etl-entities${{ matrix.etl-entities-version }}-horizon-${{ matrix.horizon-client-version }}.xml

      - name: Upload coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}-etl-entities-${{ matrix.etl-entities-version }}-horizon-${{ matrix.horizon-client-version }}
          path: reports/*
          # https://github.com/actions/upload-artifact/issues/602
          include-hidden-files: true

      - name: Shutdown Backend Container
        if: success() || failure()
        run: |
          docker compose down -v --remove-orphans
        env:
          COMPOSE_PROJECT_NAME: ${{ github.run_id }}-backend

  all_done:
    name: Tests done
    runs-on: ubuntu-latest

    permissions:
      contents: write
      checks: write
      pull-requests: write

    if: success() || failure()
    needs: [tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          path: reports/
          pattern: coverage-*
          merge-multiple: true

      - name: Show test results
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: reports/junit/*.xml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: 'false'

      # no uv cache here because fresh install takes about 1 second

      - name: Generate coverate reports
        run: |
          uv run --group test coverage combine
          uv run --group test coverage xml -o reports/coverage.xml

      - name: Coverage comment
        id: coverage
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-xml-coverage-path: ./reports/coverage.xml
          default-branch: develop
          xml-skip-covered: true
          report-only-changed-files: true
          hide-comment: ${{ github.event_name != 'pull_request' }}

      - name: Dynamic Badges
        uses: schneegans/dynamic-badges-action@v1.9.0
        if: github.repository == 'MTSWebServices/horizon-hwm-store' && github.event_name == 'push'
        with:
          auth: ${{ secrets.AUTOMERGE_TOKEN }}
          gistID: 03e73a82ecc4709934540ce8201cc3b4
          filename: horizon-hwm-store_badge.json
          label: Coverage
          message: ${{ steps.coverage.outputs.coverage }}
          color: ${{ steps.coverage.outputs.color }}

      - name: Fail if coverage too low
        if: ${{ steps.coverage.outputs.coverage < env.MIN_COVERAGE }}
        run: |
          echo "Coverage is below ${{ env.MIN_COVERAGE }}%!"
          exit 1

      - name: All done
        run: echo 1
